# ==============================================================================
# AETHER — BLUEPRINT RENDER.COM (100% GRATUITO — WEB + DESKTOP + POSTGRES FREE)
# ==============================================================================
services:
  - type: web
    name: aether-platform
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --ignore-scripts --include-workspace-root --workspace=@aether/shared --workspace=@aether/web --workspace=@aether/server && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: MEDIA_MODE
        value: p2p
      - key: MEDIASOUP_WORKERS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: aether-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: aether-postgres
    plan: free
    databaseName: aether
    user: aether

